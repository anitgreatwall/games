<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redoe OS — Mockup Template</title>
<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║  REDOE OS — MOCKUP BASE TEMPLATE                               ║
  ║  Mirrors the real React app: sidebar, layout, tokens, fonts.   ║
  ║  Start here for every feature mockup.                          ║
  ║                                                                ║
  ║  HOW TO USE:                                                   ║
  ║  1. Copy this file to _output/latest/<feature>-mockups.html    ║
  ║  2. Add screens inside <div class="wrap"> using class="scr"    ║
  ║  3. Content goes inside <div class="mn"> (main area)           ║
  ║  4. Add tabs to .pbar for screen navigation                    ║
  ║  5. Sidebar is injected via JS — set data-sb="<active-item>"   ║
  ║                                                                ║
  ║  SOURCE OF TRUTH: app-sidebar.tsx + globals.css                ║
  ║  LAST SYNCED: 2026-03-30 from redoe-os-scaffold main           ║
  ╚══════════════════════════════════════════════════════════════════╝
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   DESIGN TOKENS — synced from globals.css @theme
   ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Brand */
  --navy:#1F4E79;--blue:#2E75B6;--light:#D6E4F0;
  /* Surfaces (HTML outputs row from design-language.md) */
  --surface-1:#FFFFFF;--surface-2:#F9FAFB;
  --border:#E5E7EB;--text:#0F172A;--muted:#6B7280;
  /* Status */
  --green:#22C55E;--amber:#F59E0B;--red:#EF4444;--info:#38BDF8;--neutral:#94A3B8;
  /* Entity */
  --ent-windsor:#2563EB;--ent-hunan:#7C3AED;--ent-pes:#EA580C;--ent-pangeo:#6B7280;--ent-gta:#0891B2;--ent-ipo:#DB2777;
  /* Shadows */
  --shadow-sm:0 1px 3px 0 rgba(0,0,0,.06),0 1px 2px -1px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.05);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.04);
  --shadow-modal:0 16px 70px rgba(0,0,0,.12);
  /* Typography scale (from globals.css) */
  --text-body:13px;--text-body-sm:12px;--text-caption:11px;--text-nav:13px;--text-heading-md:20px;
  /* Motion */
  --dur-fast:150ms;--dur-normal:200ms;
  --ease-out:cubic-bezier(.25,1,.5,1);
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#EDECEA;color:var(--text);line-height:1.4;font-size:var(--text-body)}

/* ═══════════════════════════════════════════════════════════════
   PRESENTATION BAR — screen navigation for mockups
   ═══════════════════════════════════════════════════════════════ */
.pbar{background:var(--navy);padding:0 16px;height:40px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:999}
.pbar-brand{font-size:11px;font-weight:700;color:#fff;letter-spacing:-.2px;white-space:nowrap}
.pbar-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.25);flex-shrink:0}
.pbar-ctx{font-size:10px;color:rgba(255,255,255,.4);white-space:nowrap;margin-right:8px}
.tab-group{display:flex;gap:2px;align-items:center}
.tab-sep{width:1px;height:16px;background:rgba(255,255,255,.15);margin:0 4px;flex-shrink:0}
.stab{padding:4px 8px;border-radius:4px;border:none;cursor:pointer;font-family:inherit;font-size:10px;font-weight:500;white-space:nowrap;background:transparent;color:rgba(255,255,255,.4);transition:all .12s}
.stab:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.75)}
.stab.on{background:rgba(255,255,255,.16);color:#fff}

/* ═══════════════════════════════════════════════════════════════
   APP FRAME — 1280×820 card matching Vercel preview
   ═══════════════════════════════════════════════════════════════ */
.wrap{padding:16px;display:flex;justify-content:center;min-height:calc(100vh - 40px)}
.scr{display:none}.scr.on{display:block}
.af{width:1280px;height:820px;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.06);display:flex;background:var(--surface-1);position:relative}

/* ═══════════════════════════════════════════════════════════════
   SIDEBAR — exact mirror of app-sidebar.tsx
   6 groups: Overview, Jobs, Team, Operations, Finance, System
   Footer: SP avatar + Steve Pan + Admin
   ═══════════════════════════════════════════════════════════════ */
.sb{width:240px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface-1);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}

/* Header: Logo + collapse trigger */
.sb-head{padding:12px 12px 8px;display:flex;align-items:center;justify-content:space-between}
.sb-brand{display:flex;align-items:center;gap:10px;padding:0 4px}
.sb-mark{width:28px;height:28px;border-radius:7px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-name{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.3px}
.sb-collapse{width:24px;height:24px;border:none;background:none;cursor:pointer;color:var(--muted);border-radius:4px;display:flex;align-items:center;justify-content:center}
.sb-collapse:hover{color:var(--text);background:var(--surface-2)}
.sb-collapse svg{width:14px;height:14px}

/* Search bar */
.sb-srch{margin:0 8px 8px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface-1);display:flex;align-items:center;gap:8px;cursor:pointer;transition:border-color var(--dur-fast) var(--ease-out)}
.sb-srch:hover{border-color:rgba(107,114,128,.3)}
.sb-srch svg{width:14px;height:14px;color:var(--muted);flex-shrink:0}
.sb-srch-t{font-size:12px;color:var(--muted);flex:1}
.sb-srch-k{font-size:10px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:3px;padding:1px 6px;font-family:'JetBrains Mono',monospace}

/* Nav groups */
.sb-groups{flex:1;padding:0 4px;overflow-y:auto}
.sb-grp{padding:4px 0}
.sb-gl{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;height:32px;font-size:var(--text-caption);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:rgba(107,114,128,.6);border-radius:6px;cursor:pointer;transition:color var(--dur-fast)}
.sb-gl:hover{color:rgba(107,114,128,.85)}
.sb-gl svg{width:12px;height:12px;transition:transform var(--dur-normal) var(--ease-out)}
.sb-gl.open svg{transform:rotate(90deg)}
.sb-items{overflow:hidden}
.sb-it{display:flex;align-items:center;gap:8px;padding:6px 8px;margin:1px 0;font-size:var(--text-nav);color:var(--muted);cursor:pointer;border-radius:6px;transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast);position:relative}
.sb-it:hover{background:var(--surface-2);color:var(--text)}
.sb-it.act{background:var(--surface-2);color:var(--text);font-weight:500}
.sb-it svg{flex-shrink:0;width:16px;height:16px}
.sb-it span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-badge{font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;white-space:nowrap;background:var(--blue);color:#fff;position:absolute;right:8px;top:50%;transform:translateY(-50%);line-height:16px}

/* Footer: User */
.sb-foot{padding:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-user-name{font-size:14px;font-weight:500;color:var(--text)}
.sb-user-role{font-size:var(--text-caption);color:var(--muted)}

/* ═══════════════════════════════════════════════════════════════
   MAIN CONTENT AREA
   ═══════════════════════════════════════════════════════════════ */
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--surface-1);position:relative}

/* Page header */
.ph{min-height:52px;padding:0 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.bc{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.bc-s{color:#D1D5DB}
.pt{font-size:18px;font-weight:700;letter-spacing:-.3px}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center}

/* Content body */
.cb{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:14px}

/* ═══════════════════════════════════════════════════════════════
   COMMON COMPONENTS — reusable across mockup screens
   ═══════════════════════════════════════════════════════════════ */

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;font-family:inherit;font-size:var(--text-body);font-weight:500;cursor:pointer;border:1px solid;white-space:nowrap;transition:background var(--dur-fast) var(--ease-out)}
.btn-p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn-p:hover{background:#1a4068}
.btn-o{background:var(--surface-1);color:var(--text);border-color:var(--border)}.btn-o:hover{background:var(--surface-2)}
.btn svg{width:13px;height:13px;flex-shrink:0}

/* KPI strip */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex-shrink:0}
.kpi-5{grid-template-columns:repeat(5,1fr)}
.kc{border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.kl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px;white-space:nowrap}
.kv{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:500;line-height:1}
.kv-r{color:#DC2626}.kv-a{color:#D97706}.kv-g{color:#16A34A}
.ks{font-size:var(--text-caption);color:var(--muted);margin-top:4px}

/* Filter bar */
.tb{display:flex;align-items:center;gap:8px;flex-shrink:0}
.fd{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:12px;color:var(--text);background:var(--surface-1);cursor:pointer;white-space:nowrap}
.fd svg{width:12px;height:12px;color:var(--muted);flex-shrink:0}
.fc{display:inline-flex;align-items:center;gap:5px;padding:5px 8px 5px 10px;border:1px solid #BFDBFE;border-radius:6px;font-size:12px;color:var(--blue);background:#EFF6FF;cursor:pointer;white-space:nowrap}
.fc .cx{width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(37,99,235,.12);flex-shrink:0;font-size:8px;color:var(--blue)}
.tg{flex:1}

/* View switcher */
.vs{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.vb{display:flex;align-items:center;gap:5px;padding:6px 12px;border:none;border-right:1px solid var(--border);background:var(--surface-1);font-family:inherit;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background var(--dur-fast)}
.vb:last-child{border-right:none}.vb.on{background:#EFF6FF;color:var(--blue)}.vb:hover:not(.on){background:var(--surface-2)}
.vb svg{width:13px;height:13px;flex-shrink:0}

/* Data table */
.tw{flex:1;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px}
.tsc{flex:1;overflow-y:auto}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--surface-2);border-bottom:1px solid var(--border)}
thead th{padding:9px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;white-space:nowrap;position:sticky;top:0;background:var(--surface-2);z-index:1}
thead th.r{text-align:right}
tbody tr{border-bottom:1px solid var(--surface-2)}
tbody tr:hover{background:#FAFAFA}
tbody td{padding:9px 12px;font-size:var(--text-body)}
.tf{padding:10px 16px;border-top:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);flex-shrink:0}

/* Status badges */
.sbdg{padding:3px 9px;border-radius:10px;font-size:var(--text-caption);font-weight:600;white-space:nowrap;display:inline-block}
.sbdg-a{background:#FEF3C7;color:#B45309}.sbdg-g{background:#DCFCE7;color:#15803D}.sbdg-r{background:#FEE2E2;color:#B91C1C}

/* Type badges */
.tbdg{display:inline-flex;padding:2px 8px;border-radius:10px;border:1px solid;font-size:10px;font-weight:700;white-space:nowrap}
.tbdg-R{background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE}
.tbdg-G{background:#ECFDF5;color:#065F46;border-color:#A7F3D0}

/* Status dots */
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sdot-g{background:var(--green)}.sdot-a{background:var(--amber)}.sdot-r{background:var(--red)}.sdot-b{background:var(--blue)}.sdot-m{background:var(--neutral)}

/* Avatars */
.av{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0}

/* Monospace data */
.mono{font-family:'JetBrains Mono',monospace}

/* Full-page header */
.fp-head{padding:12px 24px;border-bottom:1px solid var(--border);flex-shrink:0}
.fp-bc{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.fp-title{font-size:18px;font-weight:700;letter-spacing:-.3px}
.fp-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 24px;flex-shrink:0}
.fp-tab{padding:10px 14px;font-size:var(--text-body);font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.fp-tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.fp-body{flex:1;overflow-y:auto;padding:16px 24px}

/* Modal overlay */
.modal-ov{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:center;justify-content:center}
.modal-card{background:var(--surface-1);border-radius:12px;box-shadow:var(--shadow-modal);width:680px;max-height:760px;display:flex;flex-direction:column;overflow:hidden}
.modal-card.wide{width:880px}

/* Save bar */
.save-bar{padding:10px 24px;border-top:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;gap:16px;flex-shrink:0}

/* Dim background (for modals/peek) */
.cb.dim{opacity:.25;pointer-events:none}
</style>
</head>
<body>

<!-- ═══ PRESENTATION BAR ═══ -->
<div class="pbar">
  <span class="pbar-brand">Redoe OS</span>
  <span class="pbar-dot"></span>
  <span class="pbar-ctx">Feature Name — Description</span>
  <div class="tab-group">
    <button class="stab on" onclick="show(0)">Screen 1</button>
    <button class="stab" onclick="show(1)">Screen 2</button>
  </div>
</div>

<div class="wrap">

<!-- ═══ SCREEN 1: EXAMPLE ═══ -->
<div class="scr on" id="s0"><div class="af">
  <!-- Sidebar: set data-sb to the active nav item key -->
  <div class="sb" data-sb="dashboard"></div>
  <!-- Main content area -->
  <div class="mn">
    <div class="ph">
      <div>
        <div class="bc"><span>Overview</span><span class="bc-s">/</span><span>Dashboard</span></div>
        <div class="pt">Dashboard</div>
      </div>
      <div class="hr">
        <button class="btn btn-p">Primary Action</button>
      </div>
    </div>
    <div class="cb">
      <!-- YOUR CONTENT HERE -->
      <div style="flex:1;display:flex;align-items:center;justify-content:center">
        <div style="text-align:center">
          <div style="width:64px;height:64px;border-radius:16px;background:var(--navy);color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">R</div>
          <div style="font-size:22px;font-weight:600;letter-spacing:-.3px">Redoe OS</div>
          <div style="font-size:14px;color:var(--muted);margin-top:4px">Replace this with your mockup content.</div>
        </div>
      </div>
    </div>
  </div>
</div></div>

<!-- ═══ SCREEN 2: EXAMPLE ═══ -->
<div class="scr" id="s1"><div class="af">
  <div class="sb" data-sb="pipeline"></div>
  <div class="mn">
    <div class="ph">
      <div>
        <div class="bc"><span>Jobs</span><span class="bc-s">/</span><span>Pipeline Board</span></div>
        <div class="pt">Pipeline Board</div>
      </div>
    </div>
    <div class="cb">
      <p style="color:var(--muted)">Screen 2 content goes here.</p>
    </div>
  </div>
</div></div>

</div><!-- /wrap -->

<script>
/* ── Screen navigation ── */
function show(i){
  document.querySelectorAll('.scr').forEach((s,j)=>s.classList.toggle('on',j===i));
  document.querySelectorAll('.stab').forEach((t,j)=>t.classList.toggle('on',j===i));
}

   LAST SYNCED: 2026-03-30

/* Nav structure — mirrors navGroups in app-sidebar.tsx exactly */
const NAV=[
  {label:'Overview',items:[
    {key:'dashboard',title:'Dashboard',icon:'layoutGrid',href:'/'},
    {key:'inbox',title:'Inbox',icon:'inbox',href:'/inbox',badge:'3'}
  ]},
  {label:'Jobs',items:[
    {key:'alljobs',title:'All Jobs',icon:'briefcase',href:'/jobs'},
    {key:'pipeline',title:'Pipeline Board',icon:'arrowDownUp',href:'/pipeline'},
    {key:'schedule',title:'Schedule',icon:'calendar',href:'/schedule'}
  ]},
  {label:'Team',items:[
    {key:'employees',title:'Employees',icon:'users',href:'/employees'},
    {key:'timeclock',title:'Time Clock',icon:'scanLine',href:'/time-clock'},
    {key:'timeanalytics',title:'Time Analytics',icon:'clock',href:'/time-analytics'},
    {key:'timeapproval',title:'Time Approval',icon:'clipboardCheck',href:'/time-approval',badge:'12'}
  ]},
  {label:'Operations',items:[
    {key:'machines',title:'Machines',icon:'gear',href:'/machines'},
    {key:'quality',title:'Quality',icon:'checkCircle',href:'/quality'}
  ]},
  {label:'Finance',items:[
    {key:'jobcosting',title:'Job Costing',icon:'dollar',href:'/job-costing'},
    {key:'reports',title:'Reports',icon:'barChart',href:'/reports'}
  ]},
  {label:'System',items:[
    {key:'settings',title:'Settings',icon:'gear',href:'/settings'}
  ]}
];

function buildSidebar(activeKey){
  let h='';
  // Header
  h+=`<div class="sb-head"><div class="sb-brand"><div class="sb-mark">R</div><span class="sb-name">Redoe OS</span></div><button class="sb-collapse" title="Ctrl+B">${ICONS.panelLeft}</button></div>`;
  // Search
  h+=`<div class="sb-srch">${ICONS.search}<span class="sb-srch-t">Search...</span><span class="sb-srch-k">⌘K</span></div>`;
  // Groups
  h+='<div class="sb-groups">';
  for(const g of NAV){
    h+=`<div class="sb-grp"><div class="sb-gl open">${g.label}${ICONS.chevronR}</div><div class="sb-items">`;
    for(const it of g.items){
      const act=it.key===activeKey?' act':'';
      const badge=it.badge?`<span class="sb-badge">${it.badge}</span>`:'';
      h+=`<div class="sb-it${act}">${ICONS[it.icon]}<span>${it.title}</span>${badge}</div>`;
    }
    h+='</div></div>';
  }
  h+='</div>';
  // Footer
  h+=`<div class="sb-foot"><div class="sb-avatar">SP</div><div><div class="sb-user-name">Steve Pan</div><div class="sb-user-role">Admin</div></div></div>`;
  return h;
}

// Inject sidebars
document.querySelectorAll('.sb[data-sb]').forEach(el=>{
  el.innerHTML=buildSidebar(el.dataset.sb);
});
